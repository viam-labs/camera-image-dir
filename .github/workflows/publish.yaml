name: Publish module

on:
  release:
    types: [published]
  workflow_dispatch:

# Tags must be semver (1.2.3) or a release candidate (1.2.3-rc / 1.2.3-rc1).

jobs:
  validate-tag:
    # Only meaningful for releases; a manual dispatch has no tag to check.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "Validating tag: $TAG"
          if [[ $TAG =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]*)?$ ]]; then
            echo "Tag matches semver."
          else
            echo "Error: tag does not match semver"
            exit 1
          fi

  publish:
    name: Build and upload module
    needs: [validate-tag]
    # Run after a successful validation, or directly on a manual dispatch
    # (where validate-tag is skipped rather than run).
    if: |
      always() &&
      (needs.validate-tag.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Pure Go cross-compiles every supported platform from this one runner,
      # so no per-OS build job is needed.
      - name: Build all platform packages
        run: make packages

      # Makes a manual dispatch useful: the archives are downloadable from the
      # run even when nothing is published to the registry.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: module-packages
          path: dist/module-*.tar.gz
          retention-days: 14

      - name: Download Viam CLI
        if: github.event_name == 'release'
        run: |
          curl -o viam "https://storage.googleapis.com/packages.viam.com/apps/viam-cli/viam-cli-latest-linux-amd64"
          chmod +x viam
          ./viam version

      - name: Publish to the registry
        if: github.event_name == 'release'
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ./viam login api-key \
            --key-id "${{ secrets.VIAM_KEY_ID }}" \
            --key "${{ secrets.VIAM_KEY_VALUE }}"
          for platform in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${platform%/*}"; arch="${platform#*/}"
            archive="dist/module-${os}-${arch}.tar.gz"
            echo "uploading $platform from $archive"
            ./viam module upload \
              --platform "$platform" \
              --version "$VERSION" \
              --upload "$archive"
          done
